[project]
name = "datagouv-enhanced"
version = "0.1.0"
description = "MCP server for searching, enriching, and ranking data.gouv.fr datasets and APIs."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
lint.select = ["E", "F"]
lint.ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
